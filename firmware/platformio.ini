; claude-desk firmware for GeekMagic SmallTV Ultra (ESP-12F, 4 MB flash, ST7789 240x240)
[common]
platform = espressif8266
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 160000000L                ; faster TLS handshakes
board_build.ldscript = eagle.flash.4m1m.ld   ; ~3 MB sketch space -> future OTA updates fit easily
build_flags =
    -D FW_VERSION=\"1.4.15\"
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
lib_deps =
    bodmer/TFT_eSPI@2.5.43
monitor_speed = 115200
extra_scripts = post:tools/ram_budget.py

[env:main]
extends = common
lib_deps =
    ${common.lib_deps}
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

[env:loader]
extends = common
build_flags = ${common.build_flags} -D LOADER=1
